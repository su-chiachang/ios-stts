name: STTS
options:
  bundleIdPrefix: com.jiajing
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: 5.0
    SDKROOT: auto
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    INFOPLIST_KEY_NSMicrophoneUsageDescription: "STTS needs microphone access to listen to your voice."
    INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "STTS uses on-device Apple Speech to transcribe your voice."
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    DEVELOPMENT_TEAM: FPY8L862BK
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: App/Resources/STTS.entitlements
    ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES

schemes:
  STTS:
    build:
      targets:
        STTS: all
  STTSTests:
    build:
      targets:
        STTS: all
        STTSTests: test
    test:
      gatherCoverageData: false
      targets:
        - name: STTSTests
  AppleSpeechLifecycleProbeIOS:
    build:
      targets:
        STTS: all
        AppleSpeechLifecycleProbeIOSTests: test
    test:
      gatherCoverageData: false
      targets:
        - name: AppleSpeechLifecycleProbeIOSTests
  AppleSpeechLifecycleProbeMac:
    build:
      targets:
        STTS: all
        AppleSpeechLifecycleProbeMacTests: test
    test:
      gatherCoverageData: false
      targets:
        - name: AppleSpeechLifecycleProbeMacTests

targets:
  STTS:
    type: application
    supportedDestinations: [macOS, iOS]
    sources:
      - path: App
        excludes:
          - Resources/STTS.entitlements
    resources:
      - path: App/Assets.xcassets
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: AVFAudio.framework
      - sdk: Speech.framework
        weak: true
      - sdk: FoundationModels.framework
        weak: true

  STTSTests:
    type: bundle.unit-test
    platform: macOS
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/STTS.app/Contents/MacOS/STTS"
    sources:
      - path: AppTests
    dependencies:
      - target: STTS

  AppleSpeechLifecycleProbeIOSTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/STTS.app/STTS"
    sources:
      - path: Probes
    dependencies:
      - target: STTS

  AppleSpeechLifecycleProbeMacTests:
    type: bundle.unit-test
    platform: macOS
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/STTS.app/Contents/MacOS/STTS"
    sources:
      - path: Probes
    dependencies:
      - target: STTS
