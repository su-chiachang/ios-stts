name: STTS
options:
  bundleIdPrefix: com.jiajing
  deploymentTarget:
    macOS: "15.0"
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: 5.0
    SDKROOT: auto
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    INFOPLIST_KEY_NSMicrophoneUsageDescription: "STTS needs microphone access to listen to your voice."
    INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "STTS uses on-device Apple Speech to transcribe your voice."
    GENERATE_INFOPLIST_FILE: YES
    DEVELOPMENT_TEAM: FPY8L862BK
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: App/Resources/STTS.entitlements
    ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
    LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]:
      - "@executable_path/../Frameworks"
    OTHER_LDFLAGS[sdk=macosx*]:
      - "-L$(SRCROOT)/vendor/parakeet/lib"
      - "-lparakeet"
      - "-lggml"
      - "-lggml-base"
      - "-lggml-cpu"
      - "-lggml-metal"
      - "-lggml-blas"
      - "-L$(SRCROOT)/vendor/qwentts/lib"
      - "-lqwen"
      - "-L$(SRCROOT)/vendor/audio8/lib"
      - "-laudio8"
      - "-lc++"
    OTHER_LDFLAGS[sdk=iphoneos*]:
      - "-L$(SRCROOT)/vendor/parakeet-ios/iphoneos-arm64/lib"
      - "-lparakeet_ios"
      - "-L$(SRCROOT)/vendor/qwentts-ios/iphoneos-arm64/lib"
      - "-lqwen_ios"
      - "-L$(SRCROOT)/vendor/audio8-ios/iphoneos-arm64/lib"
      - "-laudio8_ios"
      - "-lc++"
    OTHER_LDFLAGS[sdk=iphonesimulator*]:
      - "-L$(SRCROOT)/vendor/parakeet-ios/iphonesimulator-arm64/lib"
      - "-lparakeet_ios"
      - "-L$(SRCROOT)/vendor/qwentts-ios/iphonesimulator-arm64/lib"
      - "-lqwen_ios"
      - "-L$(SRCROOT)/vendor/audio8-ios/iphonesimulator-arm64/lib"
      - "-laudio8_ios"
      - "-lc++"

packages:
  NativeShims:
    path: Packages/NativeShims
  ModelBundle:
    path: Packages/ModelBundle

schemes:
  STTS:
    build:
      targets:
        STTS: all
  STTSTests:
    build:
      targets:
        STTS: all
        STTSTests: test
    test:
      gatherCoverageData: false
      targets:
        - name: STTSTests
  AppleSpeechLifecycleProbeIOS:
    build:
      targets:
        STTS: all
        AppleSpeechLifecycleProbeIOSTests: test
    test:
      gatherCoverageData: false
      targets:
        - name: AppleSpeechLifecycleProbeIOSTests
  AppleSpeechLifecycleProbeMac:
    build:
      targets:
        STTS: all
        AppleSpeechLifecycleProbeMacTests: test
    test:
      gatherCoverageData: false
      targets:
        - name: AppleSpeechLifecycleProbeMacTests

targets:
  STTS:
    type: application
    supportedDestinations: [macOS, iOS]
    sources:
      - path: App
        excludes:
          - Resources/STTS.entitlements
    resources:
      - path: App/Resources/audio8-release-manifest.json
    dependencies:
      - package: NativeShims
        product: CParakeet
      - package: NativeShims
        product: CQwenTTS
      - package: NativeShims
        product: CAudio8
      - package: ModelBundle
        product: ModelBundle
      - sdk: Accelerate.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: AVFoundation.framework
      - sdk: AVFAudio.framework
      - sdk: Speech.framework
        weak: true
      - sdk: CoreML.framework
        destinationFilters: [macOS]
    preBuildScripts:
      - name: "Check native libs"
        script: |
          set -e
          audio8_archive_ready() {
            archive="$1"
            [ -f "$archive" ] || return 1
            symbols="$(nm -gU "$archive" 2>/dev/null || true)"
            for symbol in _audio8_runtime_create _audio8_runtime_create_for_export_dtype _audio8_runtime_destroy _audio8_runtime_synthesize _audio8_audio_buffer_free _audio8_error_free; do
              case "$symbols" in
                *"$symbol"*) ;;
                *) return 1 ;;
              esac
            done
            return 0
          }
          if [ "$PLATFORM_NAME" = "macosx" ]; then
            if [ ! -f "$SRCROOT/vendor/parakeet/lib/libparakeet.a" ]; then
              "$SRCROOT/scripts/build-parakeet-macos.sh"
            fi
            if [ ! -f "$SRCROOT/vendor/qwentts/lib/libqwen.dylib" ]; then
              "$SRCROOT/scripts/build-qwentts-macos.sh"
            fi
            if ! audio8_archive_ready "$SRCROOT/vendor/audio8/lib/libaudio8.a"; then
              "$SRCROOT/scripts/build-audio8-macos.sh"
            fi
          else
            if [ ! -f "$SRCROOT/vendor/parakeet-ios/$PLATFORM_NAME-arm64/lib/libparakeet_ios.a" ]; then
              "$SRCROOT/scripts/build-parakeet-ios.sh" "$PLATFORM_NAME"
            fi
            if [ ! -f "$SRCROOT/vendor/qwentts-ios/$PLATFORM_NAME-arm64/lib/libqwen_ios.a" ]; then
              "$SRCROOT/scripts/build-qwentts-ios.sh" "$PLATFORM_NAME"
            fi
            if ! audio8_archive_ready "$SRCROOT/vendor/audio8-ios/$PLATFORM_NAME-arm64/lib/libaudio8_ios.a"; then
              "$SRCROOT/scripts/build-audio8-ios.sh" "$PLATFORM_NAME"
            fi
          fi
      - name: "Vendor libs present?"
        script: |
          set -e
          audio8_archive_ready() {
            archive="$1"
            [ -f "$archive" ] || return 1
            symbols="$(nm -gU "$archive" 2>/dev/null || true)"
            for symbol in _audio8_runtime_create _audio8_runtime_create_for_export_dtype _audio8_runtime_destroy _audio8_runtime_synthesize _audio8_audio_buffer_free _audio8_error_free; do
              case "$symbols" in
                *"$symbol"*) ;;
                *) return 1 ;;
              esac
            done
            return 0
          }
          if [ "$PLATFORM_NAME" = "macosx" ]; then
            for f in libparakeet.a libggml.a; do
              if [ ! -f "$SRCROOT/vendor/parakeet/lib/$f" ]; then
                echo "error: missing $SRCROOT/vendor/parakeet/lib/$f — run scripts/build-parakeet-macos.sh"
                exit 1
              fi
            done
            if [ ! -f "$SRCROOT/vendor/qwentts/lib/libqwen.dylib" ]; then
              echo "error: missing $SRCROOT/vendor/qwentts/lib/libqwen.dylib — run scripts/build-qwentts-macos.sh"
              exit 1
            fi
            if ! audio8_archive_ready "$SRCROOT/vendor/audio8/lib/libaudio8.a"; then
              echo "error: missing or outdated $SRCROOT/vendor/audio8/lib/libaudio8.a — run scripts/build-audio8-macos.sh"
              exit 1
            fi
          else
            if [ ! -f "$SRCROOT/vendor/parakeet-ios/$PLATFORM_NAME-arm64/lib/libparakeet_ios.a" ]; then
              echo "error: missing $SRCROOT/vendor/parakeet-ios/$PLATFORM_NAME-arm64/lib/libparakeet_ios.a — run scripts/build-parakeet-ios.sh $PLATFORM_NAME"
              exit 1
            fi
            if [ ! -f "$SRCROOT/vendor/qwentts-ios/$PLATFORM_NAME-arm64/lib/libqwen_ios.a" ]; then
              echo "error: missing $SRCROOT/vendor/qwentts-ios/$PLATFORM_NAME-arm64/lib/libqwen_ios.a — run scripts/build-qwentts-ios.sh $PLATFORM_NAME"
              exit 1
            fi
            if ! audio8_archive_ready "$SRCROOT/vendor/audio8-ios/$PLATFORM_NAME-arm64/lib/libaudio8_ios.a"; then
              echo "error: missing or outdated $SRCROOT/vendor/audio8-ios/$PLATFORM_NAME-arm64/lib/libaudio8_ios.a — run scripts/build-audio8-ios.sh $PLATFORM_NAME"
              exit 1
            fi
          fi
    postBuildScripts:
      - name: "Embed qwentts dylibs"
        script: |
          set -e
          if [ "$PLATFORM_NAME" = "macosx" ]; then
            dest="$CODESIGNING_FOLDER_PATH/Contents/Frameworks"
            mkdir -p "$dest"
            for lib in "$SRCROOT"/vendor/qwentts/lib/*.dylib; do
              cp -f "$lib" "$dest/"
              codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --timestamp=none "$dest/$(basename "$lib")" || true
            done
          fi

  STTSTests:
    type: bundle.unit-test
    platform: macOS
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/STTS.app/Contents/MacOS/STTS"
    sources:
      - path: AppTests
    dependencies:
      - target: STTS

  AppleSpeechLifecycleProbeIOSTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/STTS.app/STTS"
    sources:
      - path: Probes
    dependencies:
      - target: STTS

  AppleSpeechLifecycleProbeMacTests:
    type: bundle.unit-test
    platform: macOS
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/STTS.app/Contents/MacOS/STTS"
    sources:
      - path: Probes
    dependencies:
      - target: STTS
